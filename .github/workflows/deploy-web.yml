name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/ui/**
      - packages/preview/**
      - scripts/deploy-web
      - .github/workflows/deploy-web.yml
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easy-proto-web
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: &playwright
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      checksum: ${{ steps.archive.outputs.checksum }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm theme:build --check && pnpm web:verify
      - id: archive
        run: |
          tar -czf "$RUNNER_TEMP/web-build.tar.gz" -C apps/web/.cloudflare/output v1
          echo "checksum=$(sha256sum "$RUNNER_TEMP/web-build.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build.tar.gz
          if-no-files-found: error
          retention-days: 3

  staging:
    needs: build
    runs-on: ubuntu-24.04
    container: *playwright
    environment:
      name: web-staging
      url: https://staging.easyproto.app
    env:
      WEB_TARGET: staging
    steps: &deploy
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable && pnpm --filter @easy-proto/web... install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}
      - run: bash scripts/deploy-web "$WEB_TARGET"
        env:
          WEB_BUILD_CHECKSUM: ${{ needs.build.outputs.checksum }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WEB_DATABASE_ID: ${{ vars.WEB_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node apps/web/scripts/smoke-deployment.mjs "$WEB_TARGET"

  production:
    needs: [build, staging]
    runs-on: ubuntu-24.04
    container: *playwright
    environment:
      name: web-production
      url: https://easyproto.app
    env:
      WEB_TARGET: production
    steps: *deploy
