name: Release Mac app

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: easy-proto-mac-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: mac-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify tag and architecture
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(uname -m)" = arm64
          test "$(node -p 'process.arch')" = arm64
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Install desktop and sharing test dependencies
        run: corepack enable && pnpm --filter @easy-proto/desktop... --filter @easy-proto/web... install --frozen-lockfile
      - run: pnpm --filter @easy-proto/desktop exec install-electron --no
      - run: pnpm desktop:verify
      - name: Assemble release bundle
        run: bash scripts/package-mac "$RUNNER_TEMP/Easy Proto.app" release
      - name: Sign and notarize
        run: bash scripts/sign-mac-release "$RUNNER_TEMP/Easy Proto.app"
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/easy-proto-release/*.zip \
            "$RUNNER_TEMP"/easy-proto-release/*.dmg --draft --verify-tag --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
