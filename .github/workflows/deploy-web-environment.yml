name: Deploy web environment

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      artifact:
        type: string
        required: true
      checksum:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'staging' || inputs.target == 'production')
    runs-on: ubuntu-24.04
    environment:
      name: web-${{ inputs.target }}
      url: ${{ inputs.target == 'staging' && 'https://staging.easyproto.app' || 'https://easyproto.app' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable && pnpm --filter @easy-proto/web... install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ inputs.artifact }}
          path: ${{ runner.temp }}
      - run: bash scripts/deploy-web "$WEB_TARGET"
        env:
          WEB_TARGET: ${{ inputs.target }}
          WEB_BUILD_CHECKSUM: ${{ inputs.checksum }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WEB_DATABASE_ID: ${{ vars.WEB_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: inputs.target == 'staging'
        run: pnpm --filter @easy-proto/web exec playwright install --with-deps chromium
      - run: node apps/web/scripts/smoke-deployment.mjs "$WEB_TARGET"
        env:
          WEB_TARGET: ${{ inputs.target }}
