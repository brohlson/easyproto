<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Today</title>
    <style>
      body { margin: 0; color: #17232e; background: #edf4f0; font: 16px system-ui, sans-serif }
      header { padding: 24px; border-bottom: 1px solid #b9ccc0; font-weight: 700 }
      main { padding: 28px 24px }
      h1 { font-size: 48px; margin: 0 0 12px; letter-spacing: -.05em }
      p { margin: 0 0 28px; color: #4d6355 }
      ul { padding: 0; margin: 0; list-style: none }
      li { background: white; border-radius: 12px; padding: 20px; margin: 0 0 12px; }
      small { display: block; color: #4d6355; margin-top: 8px }
    </style>
  </head>
  <body>
    <header>Field Notes</header>
    <main>
      <h1>Today</h1>
      <p>Three things to do in the garden.</p>
      <ul>
        <li>Water the herbs<small>Patio</small></li>
        <li>Pick the tomatoes<small>Bed two</small></li>
        <li>Plant the dill<small>Seed trays</small></li>
      </ul>
    </main>
  </body>
</html>
