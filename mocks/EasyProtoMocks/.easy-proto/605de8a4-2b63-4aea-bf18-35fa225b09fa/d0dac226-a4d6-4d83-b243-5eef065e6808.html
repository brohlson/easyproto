<!doctype html>
<html lang="en">
<head><title>Home · Easy Proto</title></head>
<body>
  <header class="topbar">
    <div class="wordmark"><span class="mark" aria-hidden="true"></span>Easy Proto</div>
    <span class="workspace">Local workspace</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="hero">
      <div class="intro-copy">
        <h1 id="hero">A workspace<br>for your mockups</h1>
        <p>Create and compare HTML mockups on a canvas. Open a saved project to pick up where you left off.</p>
        <div class="actions">
          <button class="primary" type="button"><span aria-hidden="true">+</span> New Project</button>
          <button type="button">Open Project <span class="arrow" aria-hidden="true">↗</span></button>
        </div>
      </div>
      <div class="canvas-preview" aria-hidden="true">
        <div class="sample sample-left">
          <div class="sample-bar"><span></span><span></span><span></span></div>
          <div class="sample-layout"><div class="sample-sidebar"></div><div class="sample-content"><i></i><i></i><strong></strong></div></div>
        </div>
        <div class="sample sample-right">
          <div class="sample-bar"><span></span><span></span><span></span></div>
          <div class="sample-content"><i></i><i></i><div class="sample-tile-row"><strong></strong><strong></strong></div></div>
        </div>
      </div>
    </section>
    <section class="recent" aria-labelledby="recent-title">
      <h2 id="recent-title">Recent projects</h2>
      <div class="empty">
        <span class="folder-icon" aria-hidden="true"></span>
        <div><h3>No recent projects</h3><p>Projects you create or open will appear here.</p></div>
      </div>
    </section>
  </main>
</body>
</html>
